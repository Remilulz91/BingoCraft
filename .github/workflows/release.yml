name: Release

# Triggered by pushing a tag starting with "v" (e.g. v0.1.0-alpha.1):
#   git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
#
# Creates the GitHub Release with the PUBLIC jar attached. The debug jar is intentionally
# left out of public downloads; it stays available as a Build workflow artifact (Actions tab)
# or by building locally with: ./gradlew build -PbuildType=debug
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Fabric Loom 1.7 is NOT compatible with Gradle 9. The committed wrapper pins
      # Gradle 8.10; gradle/actions/setup-gradle is avoided on purpose because it
      # falls back to its own Gradle 9.x whenever ./gradlew is unusable.
      - name: Prepare Gradle wrapper
        run: |
          chmod +x ./gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, downloading..."
            curl -sSL --fail -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.10.0/gradle/wrapper/gradle-wrapper.jar
          fi
          unzip -t gradle/wrapper/gradle-wrapper.jar > /dev/null || { echo "invalid gradle-wrapper.jar"; exit 1; }
          ./gradlew --version

      - name: Build PUBLIC variant
        run: ./gradlew build --stacktrace

      # Keep the mod jar only: no -sources.jar and no debug variant.
      - name: Collect release assets
        run: |
          mkdir -p release-artifacts
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} release-artifacts/ \;
          ls -l release-artifacts

      # Release notes = this version's CHANGELOG section only.
      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v want="## [$VERSION]" '
            index($0, want) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md" > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*.jar
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
