plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

group = project.maven_group

// Build type: 'public' (default, debug commands OFF) or 'debug' (debug commands ON)
// Usage: ./gradlew build                   → public build
//        ./gradlew runClient               → debug (dev runs default to debug)
//        ./gradlew build -PbuildType=debug → debug build (separate JAR with -debug version suffix)
def isDevRun = gradle.startParameter.taskNames.any { it.toLowerCase().contains('run') }
def buildType = project.findProperty('buildType') ?: (isDevRun ? 'debug' : 'public')

// "-debug" in the version gives the debug variant its own file name:
//   - public: bingocraft-0.1.0-alpha.1.jar
//   - debug:  bingocraft-0.1.0-alpha.1-debug.jar
version = buildType == 'debug'
        ? "${project.mod_version}-debug"
        : project.mod_version

base {
    archivesName = project.archives_base_name
}

println "==> Building BingoCraft v${version} (type: ${buildType})"

// Dev runs get a fixed player name instead of Loom's random "PlayerNNN", so the same offline
// UUID comes back every launch (same card, same team, same inventory).
// Second client for LAN tests: ./gradlew runClient -PdevUsername=Player2
loom {
    runs {
        client {
            programArgs "--username", (project.findProperty('devUsername') ?: 'Remilulz_91').toString()
        }
    }
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
    mavenCentral()
}

dependencies {
    // Minecraft & Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cloth Config - configuration screens
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Mod Menu - in-game mod list
    modImplementation "com.terraformersmc:modmenu:${project.mod_menu_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "buildType", buildType

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }

    filesMatching("bingocraft.build.properties") {
        expand "build_type": buildType,
                "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
